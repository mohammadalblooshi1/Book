<!doctype html>
<html><head><meta charset="utf-8"><title>The Last Lamp trailer</title>
<style>
@font-face{font-family:Cinzel;src:url(fonts/cinzel-latin-700-normal.woff2) format('woff2');font-weight:700}
@font-face{font-family:Ruqaa;src:url(fonts/aref-ruqaa-arabic-700-normal.woff2) format('woff2');font-weight:700}
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#000}
#c{position:absolute;inset:0}
.ov{position:absolute;inset:0;pointer-events:none}
.bar{position:absolute;left:0;right:0;height:84px;background:#000;z-index:4}
#barT{top:0}#barB{bottom:0}
#flash{background:#fff;opacity:0;z-index:3}
#black{background:#000;opacity:0;z-index:5}
.card{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#000;opacity:0;z-index:6}
.big{font:700 96px Cinzel,serif;letter-spacing:.06em;background:linear-gradient(180deg,#ffe08a,#ff7a1a 55%,#c2185b);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.small{font:700 24px Cinzel,serif;letter-spacing:.35em;color:#f2e6d0;margin-top:22px}
.ar{font:700 34px Ruqaa,serif;color:#e7c98f;margin-top:14px}
</style></head><body>
<canvas id="c" width="1280" height="720"></canvas>
<div id="flash" class="ov"></div>
<div class="bar" id="barT"></div><div class="bar" id="barB"></div>
<div id="card1" class="card"><div class="big">ONE BOY</div></div>
<div id="card2" class="card"><div class="big">A THOUSAND</div><div class="small">FROM BELOW</div></div>
<div id="card3" class="card"><div class="big" style="font-size:110px">THE LAST LAMP</div><div class="ar">لا تَقُلْ اسمَكَ للرِّيح</div><div class="small" id="contact">JOIN MY TEAM</div></div>
<div id="black" class="ov"></div>
<script src="three.min.js"></script>
<script>
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const c01 = x => Math.max(0, Math.min(1, x)), seg = (t,a,b) => c01((t-a)/(b-a)), ease = x => x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const R = new THREE.WebGLRenderer({canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true});
R.setSize(1280, 720, false);
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(38, 1280/720, .1, 400);
scene.fog = new THREE.FogExp2(0x2a1420, .02);

// sunset sky dome (GTA-style hot gradient)
const sky = new THREE.Mesh(new THREE.SphereGeometry(200, 32, 16), new THREE.ShaderMaterial({side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: {k: {value: 0}},
  vertexShader: 'varying vec3 p; void main(){ p = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
  fragmentShader: 'uniform float k; varying vec3 p; void main(){ float h = clamp(p.y*1.6+.1,0.,1.); vec3 lo = mix(vec3(1.,.45,.15), vec3(.35,.05,.08), k); vec3 mid = mix(vec3(.85,.18,.35), vec3(.12,.02,.06), k); vec3 hi = mix(vec3(.12,.05,.25), vec3(.02,.0,.03), k); vec3 c = h<.35 ? mix(lo,mid,h/.35) : mix(mid,hi,(h-.35)/.65); gl_FragColor = vec4(c,1.); }'}));
scene.add(sky);
const sun = new THREE.Mesh(new THREE.CircleGeometry(14, 48), new THREE.MeshBasicMaterial({color: 0xffd27a, fog: false, transparent: true}));
sun.position.set(0, 8, -180); scene.add(sun);
const key = new THREE.DirectionalLight(0xff9a5a, 1.4); key.position.set(0, 10, -40); scene.add(key);
const fill = new THREE.HemisphereLight(0x6a3a8a, 0x2a1408, .7); scene.add(fill);

// dunes
const g = new THREE.PlaneGeometry(300, 300, 150, 150); g.rotateX(-Math.PI/2);
const gp = g.attributes.position;
for (let i = 0; i < gp.count; i++){ const x = gp.getX(i), z = gp.getZ(i); gp.setY(i, Math.sin(x*.05)*Math.cos(z*.04)*3 + Math.sin(x*.13+z*.09)*.8 + (Math.abs(x) > 25 ? (Math.abs(x)-25)*.12 : 0)); }
g.computeVertexNormals();
scene.add(new THREE.Mesh(g, new THREE.MeshStandardMaterial({color: 0xb5713c, roughness: 1})));
const groundY = (x, z) => Math.sin(x*.05)*Math.cos(z*.04)*3 + Math.sin(x*.13+z*.09)*.8 + (Math.abs(x) > 25 ? (Math.abs(x)-25)*.12 : 0);

// HERO: cloak, head, glowing sword
function makeHero(){
  const h = new THREE.Group();
  const cloakM = new THREE.MeshStandardMaterial({color: 0x2a1a12, roughness: .9});
  const body = new THREE.Mesh(new THREE.CylinderGeometry(.3,.62,1.5,14), cloakM); body.position.y = .75; h.add(body);
  const chest = new THREE.Mesh(new THREE.CylinderGeometry(.36,.3,.5,14), new THREE.MeshStandardMaterial({color: 0xcdb48a})); chest.position.y = 1.4; h.add(chest);
  const head = new THREE.Mesh(new THREE.SphereGeometry(.24, 16, 12), new THREE.MeshStandardMaterial({color: 0x7a4a30})); head.position.y = 1.85; h.add(head);
  const hair = new THREE.Mesh(new THREE.SphereGeometry(.25, 16, 12, 0, Math.PI*2, 0, Math.PI/2.3), new THREE.MeshStandardMaterial({color: 0x0e0a08})); hair.position.y = 1.88; h.add(hair);
  const mark = new THREE.Mesh(new THREE.SphereGeometry(.07, 8, 8), new THREE.MeshBasicMaterial({color: 0xffe27a})); mark.position.set(0, 1.45, .35); h.add(mark);
  const arm = new THREE.Group(); arm.position.set(.38, 1.45, 0); h.add(arm);
  const sleeve = new THREE.Mesh(new THREE.CylinderGeometry(.09,.1,.7,8), cloakM); sleeve.position.y = -.3; arm.add(sleeve);
  const sword = new THREE.Group(); sword.position.set(0, -.65, .05); arm.add(sword);
  const blade = new THREE.Mesh(new THREE.BoxGeometry(.07, 1.7, .02), new THREE.MeshBasicMaterial({color: 0xffe9a8})); blade.position.y = .95; sword.add(blade);
  const guard = new THREE.Mesh(new THREE.BoxGeometry(.4,.06,.08), new THREE.MeshStandardMaterial({color: 0x8a6a2a, metalness: .8})); guard.position.y = .1; sword.add(guard);
  const glow = new THREE.PointLight(0xffc04a, 2.5, 9, 1.4); glow.position.y = 1; sword.add(glow);
  h.userData = {arm, sword, blade, glow, mark};
  return h;
}
const hero = makeHero(); scene.add(hero);

// swing trail
const trail = new THREE.Mesh(new THREE.RingGeometry(1.0, 1.35, 40, 1, 0, Math.PI*.9), new THREE.MeshBasicMaterial({color: 0xffd36a, transparent: true, opacity: 0, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false}));
scene.add(trail);

// THE ONES FROM BELOW: tall sand-black figures with red eyes
const demons = [];
for (let i = 0; i < 26; i++){
  const d = new THREE.Group(), m = new THREE.MeshStandardMaterial({color: 0x120808, roughness: 1});
  const b = new THREE.Mesh(new THREE.CylinderGeometry(.25,.55,2.4,8), m); b.position.y = 1.2; d.add(b);
  const hd = new THREE.Mesh(new THREE.SphereGeometry(.3, 10, 8), m); hd.position.y = 2.6; hd.scale.y = 1.3; d.add(hd);
  [-1,1].forEach(s => { const e = new THREE.Mesh(new THREE.SphereGeometry(.06, 6, 6), new THREE.MeshBasicMaterial({color: 0xff2a10, fog: false})); e.position.set(s*.11, 2.68, .26); d.add(e); });
  [-1,1].forEach(s => { const cl = new THREE.Mesh(new THREE.BoxGeometry(.05,1.1,.05), m); cl.position.set(s*.42, 1.5, .1); cl.rotation.z = s*.4; d.add(cl); });
  const row = Math.floor(i/6.5), x = (i%7 - 3)*2.6 + (rnd()-.5), z = -10 - row*3.2 - rnd();
  d.position.set(x, groundY(x, z), z); d.lookAt(0, d.position.y, 10);
  d.userData = {base: d.position.y, at: .1 + rnd()*.9}; demons.push(d); scene.add(d);
}
// sand burst particles
const PB = 1600, bg = new THREE.BufferGeometry(), bp = new Float32Array(PB*3), bv = [];
for (let i = 0; i < PB; i++){ bv.push([(rnd()-.5)*8, rnd()*7, (rnd()-.5)*8]); }
bg.setAttribute('position', new THREE.BufferAttribute(bp, 3));
const burst = new THREE.Points(bg, new THREE.PointsMaterial({color: 0xffb066, size: .07, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false}));
scene.add(burst);

// the giant: sand that builds itself into a face
const N = 9000, FACE = new THREE.Vector3(0, 9, -26), fs = new Float32Array(N*3), ft = new Float32Array(N*3), fd = new Float32Array(N);
for (let i = 0; i < N; i++){
  const a = rnd()*Math.PI*2, r = 4 + rnd()*18; fs[i*3] = Math.cos(a)*r; fs[i*3+1] = 0; fs[i*3+2] = FACE.z + Math.sin(a)*r;
  let x, y; while (true){ const u = rnd()*2-1, v = rnd()*2-1; if (u*u+v*v > 1) continue; x = u*7.5; y = v*9;
    if (((x+2.7)/1.6)**2 + ((y-2.2)/.9)**2 < 1 || ((x-2.7)/1.6)**2 + ((y-2.2)/.9)**2 < 1) continue;
    if ((x/3)**2 + ((y+4)/1.6)**2 < 1) continue; break; }
  ft[i*3] = x; ft[i*3+1] = FACE.y + y; ft[i*3+2] = FACE.z + Math.sqrt(Math.max(0, 1-(x/7.5)**2-(y/9)**2))*4; fd[i] = rnd()*.5;
}
const fg = new THREE.BufferGeometry(); const fpos = new Float32Array(N*3); fg.setAttribute('position', new THREE.BufferAttribute(fpos, 3));
const face = new THREE.Points(fg, new THREE.PointsMaterial({color: 0xd99a5a, size: .14, transparent: true, opacity: .95})); scene.add(face);
const feyes = [-2.7, 2.7].map(x => { const m = new THREE.Mesh(new THREE.SphereGeometry(.7, 16, 12), new THREE.MeshBasicMaterial({color: 0xff2410, fog: false, transparent: true, opacity: 0})); m.position.set(x, FACE.y+2.2, FACE.z+3.4); scene.add(m); return m; });

// the death: sand spears erupt from below
const spears = [];
for (let i = 0; i < 7; i++){ const s = new THREE.Mesh(new THREE.ConeGeometry(.28, 4, 6), new THREE.MeshStandardMaterial({color: 0x1c0a06, emissive: 0x5a1004, roughness: 1})); s.userData = {a: i/7*Math.PI*2, tilt: .35 + rnd()*.3}; spears.push(s); scene.add(s); }

const el = id => document.getElementById(id), op = (id, v) => el(id).style.opacity = v;
function lookFrom(px,py,pz, tx,ty,tz, shake){ cam.position.set(px + Math.sin(T*41)*shake, py + Math.cos(T*37)*shake, pz); cam.lookAt(tx,ty,tz); }
let T = 0;

window.renderAt = function(t){
  T = t;
  // defaults
  hero.visible = true; demons.forEach(d => d.visible = true); face.visible = false; feyes.forEach(e => e.material.opacity = 0);
  spears.forEach(s => s.visible = false); trail.material.opacity = 0; burst.material.opacity = 0;
  sky.material.uniforms.k.value = c01((t-4)/5); sun.material.opacity = 1 - c01((t-5)/3);
  let fov = 38;
  hero.userData.arm.rotation.set(0,0,0); hero.rotation.set(0,0,0);
  demons.forEach((d, i) => { d.position.y = d.userData.base; });

  if (t < 1.2){ // SHOT 1: hero on the dune crest, sword raised against the sun
    const k = t/1.2;
    hero.position.set(0, groundY(0, 4) , 4); hero.rotation.y = Math.PI;
    hero.userData.arm.rotation.x = -2.6*ease(seg(t, .2, .8));
    demons.forEach(d => d.visible = false);
    lookFrom(1.5 - k*1, .6, 11 - k*1.5, 0, 2.2 + k*.5, 0, .01); fov = 30;
  } else if (t < 2.3){ // SHOT 2: low angle, he runs at camera, sand flying
    const k = seg(t, 1.2, 2.3);
    hero.position.set(0, 0, -6 + k*7); hero.position.y = groundY(0, hero.position.z) + Math.abs(Math.sin(k*18))*.15;
    hero.rotation.x = .25; hero.userData.arm.rotation.set(.9, 0, -.4);
    demons.forEach(d => d.visible = false);
    lookFrom(.8, .35, 4.2, 0, 1.4, -2, .05); fov = 50;
    burst.material.opacity = .5; burst.material.size = .05;
    for (let i = 0; i < PB; i++){ const v = bv[i], age = ((i*.013 + t*1.6) % 1); bp[i*3] = hero.position.x + v[0]*.3; bp[i*3+1] = groundY(0,hero.position.z) + age*v[1]*.25; bp[i*3+2] = hero.position.z - 1 - age*3; }
    bg.attributes.position.needsUpdate = true;
  } else if (t < 3.4){ // SHOT 3: they rise out of the sand, red eyes
    hero.visible = false;
    demons.forEach(d => { const r = ease(seg(t, 2.3 + d.userData.at*.7, 2.8 + d.userData.at*.7)); d.position.y = d.userData.base - 3 + r*3; });
    const k = seg(t, 2.3, 3.4); lookFrom(-3 + k*2, 1.2, 0, 0, 1.8, -14, .02); fov = 34;
  } else if (t < 4.1){ // CARD: ONE BOY
    hero.visible = false;
  } else if (t < 5.6){ // SHOT 4: the fight. slash, a demon bursts into sand, slow motion
    const k = seg(t, 4.1, 5.6);
    hero.position.set(0, groundY(0,-6), -6); hero.rotation.y = Math.PI*1.05;
    const sw = ease(seg(t, 4.35, 4.75));
    hero.userData.arm.rotation.set(-2.4 + sw*3.4, 0, -.6 + sw*1.2);
    const victim = demons[3]; victim.position.set(-.4, groundY(-.4,-8.2), -8.2);
    trail.position.set(0, 1.6, -6.9); trail.rotation.set(-.2, Math.PI, -1 + sw*1.6); trail.material.opacity = sw > 0 && sw < 1 ? .75 : (sw >= 1 ? .75*(1-seg(t, 4.75, 5.0)) : 0);
    if (t > 4.7){ victim.visible = false; burst.material.opacity = 1 - seg(t, 4.9, 5.6); burst.material.size = .09;
      const a = seg(t, 4.7, 5.6); for (let i = 0; i < PB; i++){ const v = bv[i]; bp[i*3] = victim.position.x + v[0]*a*.7; bp[i*3+1] = victim.position.y + 1.4 + (v[1]-3.5)*a*.5 - a*a*2; bp[i*3+2] = victim.position.z + v[2]*a*.7; } bg.attributes.position.needsUpdate = true; }
    const orbit = -.9 + k*1.4; lookFrom(Math.sin(orbit)*4.2, 1.6, -6 + Math.cos(orbit)*4.2, 0, 1.5, -7.2, t > 4.7 && t < 4.85 ? .08 : .01); fov = 42;
  } else if (t < 6.2){ // CARD: A THOUSAND FROM BELOW
  } else if (t < 7.9){ // SHOT 5: the giant face rises, he leaps at it
    const k = seg(t, 6.2, 7.9);
    face.visible = true;
    for (let i = 0; i < N; i++){ const q = ease(seg(t, 6.2 + fd[i], 7.1 + fd[i])); const sw = (1-q)*q*5, a = i*.7 + t*3;
      fpos[i*3] = fs[i*3] + (ft[i*3]-fs[i*3])*q + Math.cos(a)*sw; fpos[i*3+1] = fs[i*3+1] + (ft[i*3+1]-fs[i*3+1])*q; fpos[i*3+2] = fs[i*3+2] + (ft[i*3+2]-fs[i*3+2])*q + Math.sin(a)*sw; }
    fg.attributes.position.needsUpdate = true;
    feyes.forEach(e => e.material.opacity = seg(t, 7.0, 7.3));
    const leap = ease(seg(t, 7.1, 7.9));
    hero.position.set(0, groundY(0,-8) + Math.sin(leap*Math.PI)*4 + leap*2, -8 - leap*7); hero.rotation.y = Math.PI; hero.rotation.x = -.3*leap;
    hero.userData.arm.rotation.set(-2.9, 0, 0);
    demons.forEach((d, i) => { d.visible = i % 2 === 0; });
    lookFrom(3.5, 1.2, 4 - k*2, 0, 4 + k*4, -18, .03); fov = 44;
  } else if (t < 8.9){ // SHOT 6: THE SHOCK. spears of sand erupt and take him
    face.visible = true; feyes.forEach(e => e.material.opacity = 1); demons.forEach(d => d.visible = false);
    const hit = ease(seg(t, 7.95, 8.15));
    hero.position.set(0, groundY(0,-12) + 3.2 - seg(t, 8.15, 8.9)*1.2, -12); hero.rotation.x = -.3 + seg(t, 8.15, 8.9)*.9; hero.rotation.y = Math.PI;
    hero.userData.arm.rotation.set(-2.9 + seg(t, 8.2, 8.6)*3.2, 0, 0);
    hero.userData.glow.intensity = 2.5*(1 - seg(t, 8.15, 8.6));
    spears.forEach(s => { s.visible = true; const a = s.userData.a; const len = hit;
      const base = new THREE.Vector3(hero.position.x + Math.cos(a)*3.2, groundY(0,-12), hero.position.z + Math.sin(a)*3.2), tip = new THREE.Vector3(hero.position.x, hero.position.y + 1.1, hero.position.z);
      s.position.lerpVectors(base, tip, .5*len); s.lookAt(tip); s.rotateX(Math.PI/2); s.scale.set(1.3, .1 + len*1.05, 1.3); });
    lookFrom(5.5, 1.4, -4, 0, 2.6, -12, t < 8.3 ? .12 : .02); fov = 42 - hit*6;
  } else { // the sword falls, the light dies
    hero.visible = false; demons.forEach(d => d.visible = false);
  }
  cam.fov = fov; cam.updateProjectionMatrix();
  R.render(scene, cam);
  // cards and flashes
  op('card1', t >= 3.4 && t < 4.1 ? 1 : 0);
  op('card2', t >= 5.6 && t < 6.2 ? 1 : 0);
  op('card3', t >= 9.15 ? seg(t, 9.15, 9.35) : 0);
  op('flash', (t >= 4.7 && t < 4.82) ? .7 : (t >= 7.95 && t < 8.1) ? .9 - seg(t, 7.95, 8.1)*.9 : 0);
  op('black', t >= 8.9 && t < 9.15 ? 1 : 0);
};
document.getElementById('contact').textContent = (new URLSearchParams(location.search).get('c') || 'JOIN MY TEAM').toUpperCase();
renderAt(0);
</script></body></html>

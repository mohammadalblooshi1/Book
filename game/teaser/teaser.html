<!doctype html>
<html><head><meta charset="utf-8"><title>The Last Lamp teaser</title>
<style>
@font-face{font-family:Cinzel;src:url(fonts/cinzel-latin-700-normal.woff2) format('woff2');font-weight:700}
@font-face{font-family:Ruqaa;src:url(fonts/aref-ruqaa-arabic-700-normal.woff2) format('woff2');font-weight:700}
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#000}
#c{position:absolute;inset:0}
.ov{position:absolute;inset:0;pointer-events:none}
#black{background:#000}
#white{background:#fff;opacity:0}
#crack{opacity:0}
.txt{position:absolute;left:0;right:0;text-align:center;color:#d9d2c3;opacity:0}
#rule{top:300px;font:700 34px Cinzel,serif;letter-spacing:.12em}
#ruleAr{top:352px;font:700 40px Ruqaa,serif;color:#b9a986;direction:rtl}
#whisper{top:560px;font:700 26px Cinzel,serif;letter-spacing:.5em;color:#9fb6ff}
#title{top:270px;font:700 76px Cinzel,serif;letter-spacing:.16em;color:#ffb347;text-shadow:0 0 30px #ff7a1a88}
#sub{top:378px;font:700 26px Cinzel,serif;letter-spacing:.22em;color:#e8e0cf}
#contact{top:428px;font:700 22px Cinzel,serif;letter-spacing:.14em;color:#9fb6ff}
</style></head><body>
<canvas id="c" width="1280" height="720"></canvas>
<canvas id="crack" class="ov" width="1280" height="720"></canvas>
<div id="white" class="ov"></div>
<div id="black" class="ov"></div>
<div id="rule" class="txt">NEVER SAY YOUR NAME TO THE WIND</div>
<div id="ruleAr" class="txt">لا تَقُلْ اسمَكَ للرِّيح</div>
<div id="whisper" class="txt">… THEYAB …</div>
<div id="title" class="txt">THE LAST LAMP</div>
<div id="sub" class="txt">I'M BUILDING MY TEAM</div>
<div id="contact" class="txt">CONTACT_LINE</div>
<script src="three.min.js"></script>
<script>
// Deterministic 10-second teaser. Call renderAt(t) for t in [0,10].
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const clamp01 = x => Math.max(0, Math.min(1, x));
const ease = x => x < .5 ? 2*x*x : 1 - Math.pow(-2*x+2, 2)/2;
const seg = (t, a, b) => clamp01((t - a) / (b - a));

const renderer = new THREE.WebGLRenderer({canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true});
renderer.setSize(1280, 720, false);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070f);
scene.fog = new THREE.FogExp2(0x05070f, 0.035);
const camera = new THREE.PerspectiveCamera(40, 1280/720, 0.1, 300);

const moon = new THREE.DirectionalLight(0x7f97e8, 0.5); moon.position.set(-10, 20, -30); scene.add(moon);
scene.add(new THREE.HemisphereLight(0x22305c, 0x0d0905, 0.35));

// dunes
const g = new THREE.PlaneGeometry(200, 200, 120, 120); g.rotateX(-Math.PI/2);
const gp = g.attributes.position;
for (let i = 0; i < gp.count; i++){ const x = gp.getX(i), z = gp.getZ(i); gp.setY(i, Math.sin(x*.09)*Math.cos(z*.06)*1.4 + Math.sin(x*.21+z*.13)*.35 + (z < -30 ? (Math.sin(x*.05)+1)*3 : 0)); }
g.computeVertexNormals();
scene.add(new THREE.Mesh(g, new THREE.MeshStandardMaterial({color: 0x6e5636, roughness: 1})));

// village silhouettes
const dark = new THREE.MeshStandardMaterial({color: 0x1a140e, roughness: 1});
[[-9,-6,4,3,3],[8,-4,5,3.4,4],[-14,-14,6,4,4],[13,-15,5,3,4]].forEach(([x,z,w,h,d]) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), dark); m.position.set(x,h/2,z); scene.add(m); });
const moonDisc = new THREE.Mesh(new THREE.CircleGeometry(5, 40), new THREE.MeshBasicMaterial({color: 0xe8e2d0, fog: false}));
moonDisc.position.set(-42, 34, -90); scene.add(moonDisc);

// the boy (seen from behind)
const boy = new THREE.Group();
const robe = new THREE.Mesh(new THREE.CylinderGeometry(.28,.45,1.4,12), new THREE.MeshStandardMaterial({color: 0x8d7652, roughness: .9})); robe.position.y = .7; boy.add(robe);
const head = new THREE.Mesh(new THREE.SphereGeometry(.24, 16, 12), new THREE.MeshStandardMaterial({color: 0x1a120c})); head.position.y = 1.62; boy.add(head);
scene.add(boy);
const boyLight = new THREE.PointLight(0xffd36a, 0, 14, 1.5); boyLight.position.set(0, 1.3, .3); scene.add(boyLight);
const flare = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 16), new THREE.MeshBasicMaterial({color: 0xffc94a, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending}));
flare.position.set(0, 1.25, .2); scene.add(flare);

// the lamp
const lamp = new THREE.Mesh(new THREE.SphereGeometry(.12, 10, 8), new THREE.MeshBasicMaterial({color: 0xffb347}));
lamp.position.set(.9, .55, -.3); scene.add(lamp);
const lampLight = new THREE.PointLight(0xff9a3a, 2.2, 16, 1.6); lampLight.position.set(.9, .8, -.3); scene.add(lampLight);

// eyes opening across the dunes
const eyes = [];
const eyeMat = new THREE.MeshBasicMaterial({color: 0xf2f5ff, transparent: true, opacity: 0, fog: false});
for (let i = 0; i < 140; i++){
  const x = (rnd()-.5)*60, z = -6 - rnd()*45, y = .25 + rnd()*1.2;
  const pair = new THREE.Group();
  [-1,1].forEach(s => { const e = new THREE.Mesh(new THREE.SphereGeometry(.045 + rnd()*.03, 6, 6), eyeMat.clone()); e.position.x = s*.13; pair.add(e); });
  pair.position.set(x, y, z); pair.lookAt(0, 1.5, 6);
  pair.userData.at = 4.4 + rnd()*2.4; eyes.push(pair); scene.add(pair);
}

// THE NEW CREATURE: the sand builds itself into a face
const FACE = new THREE.Vector3(0, 6.2, -17);
const N = 14000, start = new Float32Array(N*3), target = new Float32Array(N*3), delay = new Float32Array(N), mouthy = new Uint8Array(N);
for (let i = 0; i < N; i++){
  const a = rnd()*Math.PI*2, r = 2 + rnd()*16;
  start[i*3] = Math.cos(a)*r; start[i*3+1] = .1 + rnd()*.4; start[i*3+2] = FACE.z + Math.sin(a)*r*.8;
  let u, v, ok = false, x, y;
  while (!ok){ u = rnd()*2-1; v = rnd()*2-1; if (u*u+v*v > 1) continue;
    x = u*5.2; y = v*6.6;
    const eyeL = Math.pow((x+1.9)/1.15,2)+Math.pow((y-1.6)/.7,2) < 1, eyeR = Math.pow((x-1.9)/1.15,2)+Math.pow((y-1.6)/.7,2) < 1;
    if (eyeL || eyeR) continue; ok = true; }
  const zf = Math.sqrt(Math.max(0, 1 - (x/5.2)**2 - (y/6.6)**2))*3.2;
  target[i*3] = FACE.x + x; target[i*3+1] = FACE.y + y; target[i*3+2] = FACE.z + zf + (rnd()-.5)*.25;
  mouthy[i] = Math.pow(x/2.6,2)+Math.pow((y+3)/1.6,2) < 1 ? 1 : 0;
  delay[i] = rnd()*.9;
}
const pg = new THREE.BufferGeometry(); const pos = new Float32Array(N*3); pos.set(start);
pg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
const sand = new THREE.Points(pg, new THREE.PointsMaterial({color: 0xcaa874, size: .09, transparent: true, opacity: .95}));
scene.add(sand);
const faceEyes = [-1.9, 1.9].map(x => { const m = new THREE.Mesh(new THREE.SphereGeometry(.42, 16, 12), new THREE.MeshBasicMaterial({color: 0xff3d1f, transparent: true, opacity: 0, fog: false})); m.position.set(FACE.x+x, FACE.y+1.6, FACE.z+2.3); scene.add(m); return m; });
const faceGlow = new THREE.PointLight(0xff4a22, 0, 30, 1.4); faceGlow.position.set(0, FACE.y+1.5, FACE.z+4); scene.add(faceGlow);

// the stone
const sg = new THREE.IcosahedronGeometry(.6, 1); const sp = sg.attributes.position;
for (let i = 0; i < sp.count; i++){ const k = .8 + rnd()*.45; sp.setXYZ(i, sp.getX(i)*k, sp.getY(i)*k, sp.getZ(i)*k); }
sg.computeVertexNormals();
const stone = new THREE.Mesh(sg, new THREE.MeshStandardMaterial({color: 0x5a4a3c, emissive: 0x3a1206, roughness: 1, flatShading: true}));
stone.visible = false; scene.add(stone);

// cracks (drawn once)
(function(){ const c = document.getElementById('crack').getContext('2d'); c.strokeStyle = '#f4f0e6'; c.lineCap = 'round';
  const cx = 660, cy = 330; for (let k = 0; k < 18; k++){ let a = k/18*Math.PI*2 + rnd()*.3, x = cx, y = cy, len = 0; c.lineWidth = 3.2; c.beginPath(); c.moveTo(x,y);
    while (len < 700){ const step = 20 + rnd()*40; a += (rnd()-.5)*.6; x += Math.cos(a)*step; y += Math.sin(a)*step; len += step; c.lineTo(x,y); c.lineWidth = Math.max(.6, 3.2 - len/220); }
    c.stroke(); }
  c.fillStyle = 'rgba(255,255,255,.85)'; c.beginPath(); c.arc(cx, cy, 26, 0, Math.PI*2); c.fill(); })();

const el = id => document.getElementById(id);
const op = (id, v) => el(id).style.opacity = v;

window.renderAt = function(t){
  // camera: slow push in, then tilt up to the face, then shake
  const push = ease(seg(t, 1.6, 5.2)), tilt = ease(seg(t, 5.0, 6.8));
  const shake = (t > 6.9 ? .05 : .015) + (t > 8.2 ? .12 : 0);
  const sx = Math.sin(t*37.1)*shake + Math.sin(t*13.7)*shake*.6, sy = Math.cos(t*29.3)*shake;
  camera.position.set(-.6 + push*.5 + sx, 1.5 + tilt*.4 + sy, 6.5 - push*2.6);
  const look = new THREE.Vector3(0, 1.2 + tilt*4.2, -2 - tilt*12);
  camera.lookAt(look);
  moonDisc.visible = tilt < .35;
  // boy turns
  boy.rotation.y = Math.PI * ease(seg(t, 6.9, 7.5)) * .55;
  // eyes
  for (const p of eyes){ const k = seg(t, p.userData.at, p.userData.at + .35); const blink = Math.sin(t*3 + p.position.x) > .97 ? 0 : 1;
    p.children.forEach(e => e.material.opacity = k * blink * (t > 8.85 ? 0 : 1)); }
  // sand rises into the face
  const p = pg.attributes.position.array;
  const mouthOpen = ease(seg(t, 7.6, 8.25));
  for (let i = 0; i < N; i++){
    const k = ease(seg(t, 4.9 + delay[i], 6.6 + delay[i]));
    const sw = (1-k)*k*6, a = i*.37 + t*2;
    let x = start[i*3] + (target[i*3]-start[i*3])*k + Math.cos(a)*sw;
    let y = start[i*3+1] + (target[i*3+1]-start[i*3+1])*k + (k>0&&k<1 ? Math.sin(a*1.3)*sw*.5 : 0);
    let z = start[i*3+2] + (target[i*3+2]-start[i*3+2])*k + Math.sin(a)*sw;
    if (mouthy[i] && mouthOpen > 0){ const dx = x - FACE.x, dy = y - (FACE.y - 3); const d = Math.hypot(dx, dy) || 1; x += dx/d*mouthOpen*2.2; y += dy/d*mouthOpen*1.6 - mouthOpen*.8; }
    if (t < 4.9){ y = start[i*3+1] + Math.sin(t*3 + i)*.03*seg(t, 3.2, 4.9); }
    p[i*3] = x; p[i*3+1] = y; p[i*3+2] = z;
  }
  pg.attributes.position.needsUpdate = true;
  faceEyes.forEach(m => m.material.opacity = seg(t, 6.3, 6.9));
  faceGlow.intensity = seg(t, 6.3, 7.2)*4 + (t > 7.6 ? mouthOpen*4 : 0);
  // the Light flares, the lamp dies
  const fl = seg(t, 7.0, 7.25) * (1 - seg(t, 7.35, 7.9));
  boyLight.intensity = fl*12; flare.material.opacity = fl*.7; flare.scale.setScalar(.2 + fl*1.1);
  const lampK = t < 7.7 ? 1 : 1 - seg(t, 7.7, 7.95);
  lampLight.intensity = 2.2*lampK*(1 + Math.sin(t*23)*.06); lamp.material.color.setHex(lampK > .05 ? 0xffb347 : 0x1a1008);
  // the stone flies at the camera
  if (t >= 8.25 && t < 9.08){ stone.visible = true; const k = Math.pow(seg(t, 8.25, 8.88), 2.2);
    const fwd = new THREE.Vector3(); camera.getWorldDirection(fwd);
    const from = new THREE.Vector3(FACE.x, FACE.y - 3, FACE.z + 3), to = camera.position.clone().addScaledVector(fwd, 1.6);
    stone.position.lerpVectors(from, to, k); stone.rotation.set(t*9, t*7, t*5); stone.scale.setScalar(1 + k*1.6); }
  else stone.visible = false;
  renderer.render(scene, camera);
  // overlays
  op('black', t < 1.9 ? 1 : t < 2.7 ? 1 - seg(t, 1.9, 2.7) : t >= 9.08 ? 1 : 0);
  op('white', t >= 8.86 && t < 8.98 ? .85 - seg(t, 8.86, 8.98)*.85 : 0);
  op('crack', t >= 8.86 && t < 9.3 ? 1 : 0);
  el('crack').style.zIndex = t >= 9.08 ? 5 : 0;
  op('rule', t < .3 ? 0 : t < 1.0 ? seg(t, .3, 1.0) : 1 - seg(t, 1.6, 2.3));
  op('ruleAr', t < .6 ? 0 : t < 1.3 ? seg(t, .6, 1.3)*.9 : .9 - seg(t, 1.6, 2.3)*.9);
  op('whisper', seg(t, 5.0, 5.4)*(1 - seg(t, 6.0, 6.5))*.8);
  op('title', seg(t, 9.25, 9.5));
  op('sub', seg(t, 9.45, 9.65));
  op('contact', seg(t, 9.55, 9.75));
};
document.getElementById('contact').textContent = (new URLSearchParams(location.search).get('c') || 'JOIN ME').toUpperCase();
renderAt(0);
</script></body></html>
